<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>출결 키오스크</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { user-select: none; }
  /* 설정 패널 슬라이더를 어두운 테마에 맞게 */
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px;
    background: #475569; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #6366f1; border: 2px solid #c7d2fe; cursor: pointer; margin-top: -6px; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #6366f1;
    border: 2px solid #c7d2fe; cursor: pointer; }
  input[type=range]::-moz-range-track { background: #475569; height: 4px; border-radius: 999px; }
</style>
</head>
<body class="bg-slate-900 text-white h-screen w-screen overflow-hidden">
<div id="app" class="h-full w-full flex overflow-hidden"></div>

<script>
const { createApp } = Vue;

function getParam(k){
  return new URLSearchParams(location.search).get(k) || '';
}

async function kioskApi(method, path, body){
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  let json;
  try { json = await res.json(); } catch (e) { throw new Error('서버 응답 오류'); }
  if (json.error) {
    const d = json.data;
    throw new Error(typeof d === 'string' ? d : (json.error || '오류'));
  }
  return json.data;
}

createApp({
  data(){
    return {
      b: getParam('b'), t: getParam('t'),
      clock: '', digits: '',
      stage: 'keypad',       // keypad | matches | result | error | staffpad | staffpick | staffconfirm
      staffDigits: '', staffMatches: [], staffPick: null, staffAction: '',
      matches: [], resultMsg: '', resultSub: '', busy: false,
      board: [], nowMin: 0,
      isFullscreen: false,
      // 화면 설정 기본값(2026-08): 좌우 58%/42%, 출결현황 120%, 키오스크 150%.
      // 이미 쓰던 기기도 한 번은 이 값으로 맞춰지고, 그 뒤 기기에서 바꾼 값은 계속 유지된다.
      leftRatio: (function(){
        if (!localStorage.getItem('kiosk_view_defaults_v2')){
          localStorage.setItem('kiosk_left_ratio', 58);
          localStorage.setItem('kiosk_left_zoom', 120);
          localStorage.setItem('kiosk_right_zoom', 150);
          localStorage.setItem('kiosk_view_defaults_v2', '1');
        }
        return parseInt(localStorage.getItem('kiosk_left_ratio')) || 58;
      })(),
      leftZoom: parseInt(localStorage.getItem('kiosk_left_zoom')) || 120,
      rightZoom: parseInt(localStorage.getItem('kiosk_right_zoom')) || 150,
      ratioSettingsOpen: false,
      soundModes: [
        { k:'off',   l:'끄기',                d:'' },
        { k:'beep',  l:'알림음만',            d:'띵동' },
        { k:'name',  l:'알림음 + 이름 + 음성', d:'"홍길동님 등원하였습니다"' },
        { k:'voice', l:'알림음 + 음성',        d:'이름 없이 "등원 완료되었습니다"' },
      ],
      soundStu: localStorage.getItem('kiosk_sound_stu') || 'off',
      soundStaff: localStorage.getItem('kiosk_sound_staff') || 'off',
      soundVol: parseInt(localStorage.getItem('kiosk_sound_vol') ?? '70'),
      voices: [],
      // 한국어 전용 음성은 3개뿐(선히·인준·현수)이라, 한국어도 읽는 다국어 음성을 더해
      // 여성 3 · 남성 3으로 맞췄다. 다국어 음성은 억양이 조금 다를 수 있어 들어보고 고른다.
      voicePacks: [
        { k:'sunhi',  g:'여성', l:'선히',     d:'한국어 전용 · 차분함' },
        { k:'ava',    g:'여성', l:'아바',     d:'다국어 · 밝음' },
        { k:'emma',   g:'여성', l:'엠마',     d:'다국어 · 또렷함' },
        { k:'injoon', g:'남성', l:'인준',     d:'한국어 전용 · 또렷함' },
        { k:'hyunsu', g:'남성', l:'현수',     d:'한국어 전용 · 부드러움' },
        { k:'brian',  g:'남성', l:'브라이언', d:'다국어 · 차분함' },
      ],
      voicePack: localStorage.getItem('kiosk_voice_pack') || 'sunhi',
      voiceSampleMsg: '', _voiceAudio: null, _voiceMsgTimer: null,
      _audioCtx: null,
      deviceId: '', deviceStatus: 'checking',  // checking | confirm | PENDING | APPROVED | REVOKED | badlink
      deviceNameInput: '',
    };
  },
  computed: {
    isStaffStage(){ return this.stage==='staffpad' || this.stage==='staffpick' || this.stage==='staffconfirm'; },
    staffDots(){ const arr=['','','','','']; for(let i=0;i<this.staffDigits.length;i++) arr[i]=this.staffDigits[i]; return arr; },
    undoWindowMsg(){ return '5분 이내 출퇴근은 취소할 수 있습니다.'; },
    dots(){ const arr=['','','','']; for(let i=0;i<this.digits.length;i++) arr[i]=this.digits[i]; return arr; },
    // 화면에 그릴 행 정보를 '한 번에' 계산해 캐시한다.
    // 예전엔 행마다 boardOrdered()·statusInfo()·elapsed()를 다시 호출해서, 인원이 늘면
    // 계산량이 세제곱으로 커졌다(1초마다 시계가 갱신돼 매초 반복). 44명 기준 태블릿에서
    // 눈에 띄게 버벅였음. 아래처럼 한 번만 계산하면 인원이 늘어도 부담이 없다.
    boardRows(){
      const mn = t => this.hmMin(t);
      // 시간순으로 먼저 정렬해 둔다(서버 순서에 기대면 연속수업 위/아래가 뒤집힐 수 있음)
      const list = this.board.slice().sort((a,b)=>mn(a.start_time)-mn(b.start_time));
      // 같은 학생의 이어지는 수업 짝 찾기(앞→뒤)
      const byStudent = new Map();
      list.forEach(it=>{ if(it.student_id) (byStudent.get(it.student_id) || byStudent.set(it.student_id,[]).get(it.student_id)).push(it); });
      const nextOf = new Map(), prevOf = new Map();
      byStudent.forEach(arr=>{
        arr.forEach(a=>{
          const end = mn(a.start_time) + (a.duration_minutes||60);
          const nxt = arr.find(b=>b!==a && mn(b.start_time)===end);
          if (nxt){ nextOf.set(a,nxt); prevOf.set(nxt,a); }
        });
      });
      // 연속수업은 시간순 정렬을 깨더라도 서로 붙여서 배치
      const emitted = new Set(), ordered = [];
      list.forEach(it=>{
        if (emitted.has(it)) return;
        ordered.push(it); emitted.add(it);
        const nxt = nextOf.get(it);
        if (nxt && !emitted.has(nxt)){ ordered.push(nxt); emitted.add(nxt); }
      });
      // 등원/하원을 공유하는 수업끼리 경과시간 나눠 배분(마지막 수업이 초과분을 받음)
      const shareOf = new Map();
      byStudent.forEach(arr=>{
        const sib = arr.filter(o=>o.status!=='ABSENT' && o.att && o.att.in)
                       .sort((a,b)=>mn(a.start_time)-mn(b.start_time));
        if (!sib.length) return;
        const start = mn(sib[0].att.in);
        const end = sib[0].att.out ? mn(sib[0].att.out) : this.nowMin;
        let remaining = Math.max(0, end - start);
        sib.forEach((o,k)=>{
          const dur = o.duration_minutes||60;
          const share = (k===sib.length-1) ? remaining : Math.min(remaining, dur);
          shareOf.set(o, share);
          remaining = Math.max(0, remaining - dur);
        });
      });
      const rows = ordered.map((r,i)=>{
        const partner = nextOf.get(r) || prevOf.get(r) || null;
        let role = null;
        if (partner){
          if (ordered[i+1]===partner) role = 'first';
          else if (ordered[i-1]===partner) role = 'second';
        }
        const dur = r.duration_minutes||60;
        const share = shareOf.get(r);
        return { r, role, hasPartner: !!partner,
                 elapsed: (share===undefined) ? '' : (share+'분 / '+dur+'분'),
                 status: this.statusFor(r, prevOf.get(r) || null),
                 nameCls: this.nameCls(r) };
      });
      // 이미 시작된 마지막 수업 바로 다음 위치(붙여배치로 순서가 섞이므로 뒤에서부터)
      let nowIdx = 0;
      for (let i=rows.length-1;i>=0;i--){ if (mn(rows[i].r.start_time) <= this.nowMin){ nowIdx = i+1; break; } }
      return { rows, nowIdx };
    },
    checkedInCount(){ return this.board.filter(r=>r.att && r.att.in).length; },
    checkedOutCount(){ return this.board.filter(r=>r.att && r.att.out).length; },
  },
  methods: {
    tickClock(){
      const d = new Date();
      const p = x => String(x).padStart(2,'0');
      const WD = ['일','월','화','수','목','금','토'];
      this.clock = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'  ('+WD[d.getDay()]+')';
      this.nowMin = d.getHours()*60 + d.getMinutes();
    },
    hmMin(hm){ if (!hm) return 0; const [h,m] = hm.split(':').map(Number); return h*60+m; },
    wdOf(dateStr){ if (!dateStr) return ''; const WD=['일','월','화','수','목','금','토']; return WD[new Date(dateStr+'T00:00:00').getDay()]; },
    mkAbsenceRefSuffix(row){
      if (!row.linked || row.linked.kind!=='absence') return '(결석연결없음)';
      return '(결석 '+row.linked.date.slice(5)+'('+this.wdOf(row.linked.date)+'))';
    },
    stuAbsenceSuffix(row){
      if (row.no_makeup) return '(보강없음/숙제대체)';
      const lk = row.linked;
      if (!lk) return '(보강미정)';
      const md = lk.date.slice(5)+'('+this.wdOf(lk.date)+')';
      if (lk.status==='ABSENT') return '(보강결석)';
      if (lk.done) return '(보강 '+md+' 완료)';
      return '(보강 '+md+' 예정)';
    },
    statusFor(row, prevPartner){
      if (row.status==='ABSENT') return { label:'결석'+this.stuAbsenceSuffix(row), cls:'text-rose-400' };
      if (row.status==='LEAVE') return { label:'임시휴원', cls:'text-purple-400' };
      // 휴무일은 안 오는 게 정상이라 미등원 경고를 띄우지 않는다(오면 등원 시각만 표시)
      if (row.status==='HOLIDAY' && !row.att.in) return { label:'휴무', cls:'text-slate-400' };
      if (row.is_makeup) return { label:'보강'+this.mkAbsenceRefSuffix(row), cls:'text-blue-400' };
      if (row.att.in){
        // 연속수업이면 지각/일찍 기준은 앞 타임 시작시각
        const refStart = prevPartner ? prevPartner.start_time : row.start_time;
        const diff = this.hmMin(row.att.in) - this.hmMin(refStart);
        if (diff > 5) return { label:diff+'분 지각', cls:'text-amber-400' };
        if (diff < -5) return { label:(-diff)+'분 일찍', cls:'text-emerald-300' };
        return null;
      }
      if (this.hmMin(row.start_time) < this.nowMin) return { label:'미등원', cls:'text-rose-300' };
      return null;
    },
    nameCls(row){
      if (row.status==='ABSENT' || row.status==='LEAVE' || row.status==='HOLIDAY') return 'line-through';
      if (!row.att.in && this.hmMin(row.start_time) < this.nowMin) return 'text-red-500';
      return '';
    },
    // 같은 학생의 바로 이어지는 연속 수업(뒤 수업 시작=앞 수업 종료) 파트너 찾기 — 포털 오늘 운영과 동일 규칙
    scrollToNow(){
      this.$nextTick(()=>{
        const el = this.$refs.nowRow;
        const target = Array.isArray(el) ? el[0] : el;
        if (target && target.scrollIntoView) target.scrollIntoView({ block:'center', behavior:'smooth' });
      });
    },
    async loadBoard(){
      try {
        const d = await kioskApi('GET', '/api/academy/kiosk_board?b='+encodeURIComponent(this.b)+'&t='+encodeURIComponent(this.t)+'&device_id='+encodeURIComponent(this.deviceId));
        this.board = d.rows||[];
        this.scrollToNow();
      } catch(e){ /* 조용히 실패(우측 키패드 동작에는 영향 없음) */ }
    },
    async requestDevice(){
      const wasApproved = this.deviceStatus === 'APPROVED';
      try {
        const d = await kioskApi('POST', '/api/academy/kiosk_device_request', { b:this.b, t:this.t, device_id:this.deviceId, user_agent:navigator.userAgent, label:this.deviceNameInput });
        this.deviceStatus = d.status;
        if (!wasApproved && this.deviceStatus === 'APPROVED'){
          this.loadBoard();
          if (!this._boardInterval) this._boardInterval = setInterval(this.loadBoard, 25000);
        }
      } catch(e){ this.deviceStatus = 'badlink'; this.resultSub = e.message || ''; }
    },
    // 이 기기 최초 접속: 자동 신청 대신 이름을 입력받아 확인 후 등록 신청
    async confirmDeviceRequest(){
      this.deviceId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(16).slice(2)));
      localStorage.setItem('kiosk_device_id', this.deviceId);
      this.deviceStatus = 'checking';
      await this.requestDevice();
      if (!this._pollInterval) this._pollInterval = setInterval(()=>{ if (this.deviceStatus!=='APPROVED') this.requestDevice(); }, 5000);
    },
    press(n){
      if (this.stage !== 'keypad' || this.busy) return;
      if (this.digits.length >= 4) return;
      this.digits += String(n);
      if (this.digits.length === 4) this.lookup();
    },
    backspace(){ if (this.stage==='keypad') this.digits = this.digits.slice(0,-1); },
    async lookup(){
      this.busy = true;
      try {
        const d = await kioskApi('GET', '/api/academy/kiosk_lookup?b='+encodeURIComponent(this.b)+'&t='+encodeURIComponent(this.t)+'&device_id='+encodeURIComponent(this.deviceId)+'&last4='+this.digits);
        if (!d.matches || !d.matches.length){
          this.resultMsg = '일치하는 학생이 없습니다.';
          this.resultSub = '번호를 다시 확인해주세요.';
          this.stage = 'error'; this.failSound('stu');
          setTimeout(()=>this.reset(), 2200);
        } else if (d.matches.length === 1){
          this.matches = d.matches;
          this.confirm(d.matches[0]);
        } else {
          this.matches = d.matches;
          this.stage = 'matches';
        }
      } catch(e){
        this.resultMsg = '오류가 발생했습니다.';
        this.resultSub = e.message || '';
        this.stage = 'error'; this.failSound('stu');
        setTimeout(()=>this.reset(), 2500);
      } finally { this.busy = false; }
    },
    async confirm(m){
      this.busy = true;
      try {
        const d = await kioskApi('POST', '/api/academy/kiosk_check', { b:this.b, t:this.t, device_id:this.deviceId, student_id:m.student_id });
        if (d.action === 'in'){ this.resultMsg = d.name+'님 등원 완료'; this.resultSub = d.time; this.notifySound('stu', d.name, '등원', m.student_id); }
        else if (d.action === 'out'){ this.resultMsg = d.name+'님 하원 완료'; this.resultSub = d.time; this.notifySound('stu', d.name, '하원', m.student_id); }
        else { this.resultMsg = d.name+'님은 오늘 등원·하원이 모두 처리되었습니다.'; this.resultSub = '등원 '+(d.in||'-')+' · 하원 '+(d.out||'-'); this.failSound('stu'); }
        this.stage = 'result';
        this.loadBoard();
        setTimeout(()=>this.reset(), 2600);
      } catch(e){
        this.resultMsg = '처리 중 오류가 발생했습니다.';
        this.resultSub = e.message || '';
        this.stage = 'error'; this.failSound('stu');
        setTimeout(()=>this.reset(), 2500);
      } finally { this.busy = false; }
    },
    reset(){ this.digits=''; this.matches=[]; this.resultMsg=''; this.resultSub=''; this.stage='keypad';
             this.staffDigits=''; this.staffMatches=[]; this.staffPick=null; this.staffAction=''; },

    // ── 소리 ──
    // 음원 파일 없이 브라우저에서 직접 소리를 만든다(외부 요청 없음 = 인터넷이 끊겨도 남).
    setSound(who, v){
      if (who === 'stu'){ this.soundStu = v; localStorage.setItem('kiosk_sound_stu', v); }
      else { this.soundStaff = v; localStorage.setItem('kiosk_sound_staff', v); }
    },
    setSoundVol(v){ this.soundVol = parseInt(v); localStorage.setItem('kiosk_sound_vol', this.soundVol); },
    _ctx(){
      if (!this._audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this._audioCtx = new AC();
      }
      if (this._audioCtx.state === 'suspended') this._audioCtx.resume();
      return this._audioCtx;
    },
    _tone(freq, start, dur, gainScale){
      const ctx = this._ctx(); if (!ctx) return;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      const vol = (this.soundVol/100) * (gainScale||1) * 0.25;
      osc.type = 'sine'; osc.frequency.value = freq;
      // 뚝 끊기면 '틱' 소리가 나서 시작·끝을 부드럽게 감싼다
      g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(ctx.currentTime + start); osc.stop(ctx.currentTime + start + dur + 0.02);
    },
    beepOk(){ this._tone(880, 0, 0.16); this._tone(1175, 0.14, 0.22); },      // 띵동(올라가는 두 음)
    beepFail(){ this._tone(320, 0, 0.22, 1.2); this._tone(240, 0.20, 0.30, 1.2); },  // 낮게 두 번
    // getVoices() 는 처음 부를 때 빈 배열을 주고 잠시 뒤에 채워진다(브라우저 공통).
    // 그래서 목록을 미리 받아 두고, 늦게 채워지면 voiceschanged 로 다시 받는다.
    initVoices(){
      if (!window.speechSynthesis) return;
      const load = () => { this.voices = window.speechSynthesis.getVoices() || []; };
      load();
      window.speechSynthesis.onvoiceschanged = load;
      // 일부 기기는 이벤트도 안 오고 조금 뒤에야 채워진다
      setTimeout(load, 500); setTimeout(load, 2000);
    },
    koVoice(){ return (this.voices||[]).find(v=>/^ko/i.test(v.lang)) || null; },
    speak(text){
      if (!text || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR'; u.volume = this.soundVol/100; u.rate = 1.0;
        const ko = this.koVoice();
        if (ko) u.voice = ko;
        window.speechSynthesis.speak(u);
      } catch(e){ /* 음성이 없는 기기면 알림음만 나고 조용히 넘어간다 */ }
    },
    // 미리 만들어 둔 mp3 를 재생한다. 태블릿에 한국어 음성이 없어도 똑같이 들린다.
    playFile(url){
      try {
        if (this._voiceAudio) this._voiceAudio.pause();
        const a = new Audio(url);
        a.volume = Math.max(0, Math.min(1, this.soundVol/100));
        this._voiceAudio = a;
        a.play().catch(()=>{});
        return true;
      } catch(e){ return false; }
    },
    // who: 'stu'|'staff', name: 이름, what: '등원'|'하원'|'출근'|'퇴근', id: 학생 id
    notifySound(who, name, what, id){
      const mode = who==='stu' ? this.soundStu : this.soundStaff;
      if (mode === 'off') return;
      this.beepOk();
      if (mode === 'name' && who === 'stu' && id){
        // 이름 음성은 학생만 있다. 파일이 없으면(새 학생 등) 알림음만 나고 넘어간다.
        setTimeout(()=> this.playFile('/public/voice/' + id + '_' + (what==='등원' ? 'in' : 'out') + '.mp3'), 380);
      } else if (mode === 'name' || mode === 'voice'){
        this.speak(name + '님 ' + what + '하였습니다');
      }
    },
    failSound(who){
      const mode = who==='stu' ? this.soundStu : this.soundStaff;
      if (mode === 'off') return;
      this.beepFail();
      // 실패는 이름을 부를 게 없으니 어느 모드든 같은 안내
      if (mode === 'name' || mode === 'voice') this.speak('다시 확인해 주세요');
    },
    setVoicePack(k){ this.voicePack = k; localStorage.setItem('kiosk_voice_pack', k); this.playVoiceSample(k); },
    playVoiceSample(k){
      clearTimeout(this._voiceMsgTimer);
      try {
        if (this._voiceAudio) this._voiceAudio.pause();
        const a = new Audio('/portal/voice/sample_' + k + '.mp3');
        a.volume = Math.max(0, Math.min(1, this.soundVol/100));
        this._voiceAudio = a;
        a.onerror = () => { this.voiceSampleMsg = '샘플을 불러오지 못했습니다.'; };
        a.play().catch(()=>{ this.voiceSampleMsg = '재생이 막혔습니다. 화면을 한 번 누른 뒤 다시 시도하세요.'; });
        this.voiceSampleMsg = (this.soundVol === 0) ? '볼륨이 0입니다.' : '';
      } catch(e){ this.voiceSampleMsg = '재생할 수 없습니다.'; }
      this._voiceMsgTimer = setTimeout(()=>{ this.voiceSampleMsg = ''; }, 4000);
    },

    openStaffPad(){ this.staffDigits=''; this.staffMatches=[]; this.staffPick=null; this.stage='staffpad'; },
    staffPress(n){
      if (this.stage!=='staffpad' || this.busy) return;
      if (this.staffDigits.length >= 5) return;
      this.staffDigits += String(n);
      if (this.staffDigits.length === 5) this.staffLookup();
    },
    staffBackspace(){ if (this.stage==='staffpad') this.staffDigits = this.staffDigits.slice(0,-1); },
    async staffLookup(){
      this.busy = true;
      try {
        const d = await kioskApi('POST','/api/academy/kiosk_staff_lookup',
          { b:this.b, t:this.t, device_id:this.deviceId, staff_no:this.staffDigits });
        this.staffMatches = d.matches || [];
        if (this.staffMatches.length === 1) this.staffChoose(this.staffMatches[0]);
        else this.stage = 'staffpick';
      } catch(e){
        this.resultMsg = '확인할 수 없습니다.';
        this.resultSub = e.message || '';
        this.stage = 'error'; this.failSound('staff');
        setTimeout(()=>this.reset(), 2500);
      } finally { this.busy = false; }
    },
    staffChoose(m){
      this.staffPick = m;
      if (m.next === 'done'){
        // 오늘 출퇴근이 끝난 상태 — 잘못 찍었을 때만 취소로 들어갈 수 있게 한다
        this.staffAction = 'UNDO';
      } else {
        this.staffAction = (m.next === 'out') ? 'OUT' : 'IN';
      }
      this.stage = 'staffconfirm';
    },
    async staffSubmit(){
      this.busy = true;
      try {
        const d = await kioskApi('POST','/api/academy/kiosk_staff_check',
          { b:this.b, t:this.t, device_id:this.deviceId, staff_id:this.staffPick.staff_id, action:this.staffAction });
        if (d.action === 'UNDO'){
          this.resultMsg = d.name+'님 '+(d.field==='OUT'?'퇴근':'출근')+' 기록이 취소되었습니다.';
          this.resultSub = '다시 찍어주세요.';
          this.failSound('staff');
        } else {
          this.resultMsg = d.name+'님 '+(d.action==='IN'?'출근':'퇴근')+' 완료';
          this.resultSub = d.time;

    },

  },

    this.deviceId = localStorage.getItem('kiosk_device_id') || '';

            <button @click="staffDigits=''" class="h-14 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm text-slate-300">전체지움</button>
            <button @click="staffPress(0)" class="h-14 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-xl font-semibold">0</button>
            <button @click="staffBackspace" class="h-14 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm text-slate-300">◀ 지우기</button>
          </div>
        </template>

        <!-- 직원 출퇴근 2단계: 이름 확인(습관적으로 눌러 남의 것을 찍는 사고 방지) -->
        <template v-else-if="stage==='staffpick'">
          <button @click="reset" class="w-full mb-3 h-12 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-base font-semibold flex items-center justify-center gap-2">
            <span>✕ 취소</span><span class="text-emerald-200 font-normal">/</span><span class="font-normal">🎒 학생 등하원으로</span>
          </button>
          <div class="text-sm text-slate-300 mb-4">본인 이름을 선택하세요</div>
          <div class="flex flex-col gap-2.5">
            <button v-for="m in staffMatches" :key="m.staff_id" @click="staffChoose(m)"
                    class="h-16 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold flex flex-col items-center justify-center">
              <span class="text-lg">{{ m.name }}</span>
              <span class="text-xs font-normal text-indigo-200">
                <template v-if="m.on_leave">오늘 휴가</template>
                <template v-else-if="m.next==='in'">출근 전</template>
                <template v-else-if="m.next==='out'">출근 {{ m.in }} · 퇴근 찍기</template>
                <template v-else>출근 {{ m.in }} · 퇴근 {{ m.out }}</template>
              </span>
            </button>
          </div>
        </template>

        <!-- 직원 출퇴근 3단계: 확인 -->
        <template v-else-if="stage==='staffconfirm'">
          <button @click="reset" class="w-full mb-3 h-12 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-base font-semibold flex items-center justify-center gap-2">
            <span>✕ 취소</span><span class="text-emerald-200 font-normal">/</span><span class="font-normal">🎒 학생 등하원으로</span>
          </button>
          <div class="text-lg font-bold mb-1">{{ staffPick && staffPick.name }}</div>
          <div class="text-sm text-slate-300 mb-4" v-if="staffAction==='UNDO'">
            {{ undoWindowMsg }}<br>취소하시겠습니까?
          </div>
          <div class="text-sm text-slate-300 mb-4" v-else>
            {{ staffAction==='IN' ? '출근' : '퇴근' }}으로 기록합니다.<br>
            <span class="text-xs text-slate-400">이후 수정은 원장 승인이 필요합니다.</span>
          </div>
          <div class="flex flex-col gap-2.5">
            <button @click="staffSubmit" class="h-14 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-lg font-semibold">
              {{ staffAction==='UNDO' ? '취소하기' : (staffAction==='IN' ? '출근' : '퇴근') }}
            </button>
            <button v-if="staffAction!=='UNDO' && staffPick && (staffPick.in || staffPick.out)" @click="staffAction='UNDO'"
                    class="h-11 rounded-xl border border-slate-600 text-slate-300 text-sm">방금 잘못 찍었어요</button>
            <button v-if="staffAction==='UNDO'" @click="staffPick && staffPick.next!=='done' ? staffChoose(staffPick) : reset()" class="mt-1 text-sm text-slate-400">뒤로</button>
          </div>
        </template>

        <template v-else-if="stage==='matches'">
          <div class="text-sm text-slate-300 mb-4">본인 이름을 선택하세요</div>
          <div class="flex flex-col gap-2.5">
            <button v-for="m in matches" :key="m.student_id" @click="confirm(m)"
                    class="h-14 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-lg font-semibold flex flex-col items-center justify-center">
              <span>{{ m.name }}</span>
              <span class="text-xs font-normal text-indigo-200">{{ m.school }}</span>
            </button>
            <button @click="reset" class="mt-2 text-sm text-slate-400">취소</button>
          </div>
        </template>

        <template v-else-if="stage==='result'">
          <div class="text-4xl mb-4">✅</div>
          <div class="text-xl font-bold mb-2">{{ resultMsg }}</div>
          <div class="text-base text-slate-300">{{ resultSub }}</div>
        </template>

        <template v-else-if="stage==='error'">
          <div class="text-4xl mb-4">⚠️</div>
          <div class="text-xl font-bold mb-2">{{ resultMsg }}</div>
          <div class="text-base text-slate-300">{{ resultSub }}</div>
        </template>
      </div>
    </div>
    </template>
  `,
}).mount('#app');
</script>
</body>
</html>
