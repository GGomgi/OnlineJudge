<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>출결 키오스크</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { user-select: none; }
  /* 설정 패널 슬라이더를 어두운 테마에 맞게 */
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px;
    background: #475569; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #6366f1; border: 2px solid #c7d2fe; cursor: pointer; margin-top: -6px; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #6366f1;
    border: 2px solid #c7d2fe; cursor: pointer; }
  input[type=range]::-moz-range-track { background: #475569; height: 4px; border-radius: 999px; }
</style>
</head>
<body class="bg-slate-900 text-white h-screen w-screen overflow-hidden">
<div id="app" class="h-full w-full flex overflow-hidden"></div>

<script>
const { createApp } = Vue;

function getParam(k){
  return new URLSearchParams(location.search).get(k) || '';
}

async function kioskApi(method, path, body){
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  let json;
  try { json = await res.json(); } catch (e) { throw new Error('서버 응답 오류'); }
  if (json.error) {
    const d = json.data;
    throw new Error(typeof d === 'string' ? d : (json.error || '오류'));
  }
  return json.data;
}

createApp({
  data(){
    return {
      b: getParam('b'), t: getParam('t'),
      clock: '', digits: '',
      stage: 'keypad',       // keypad | matches | result | error
      matches: [], resultMsg: '', resultSub: '', busy: false,
      board: [], nowMin: 0,
      isFullscreen: false,
      keepAwake: localStorage.getItem('kiosk_keep_awake') === '1',
      _wakeLock: null,
      leftRatio: parseInt(localStorage.getItem('kiosk_left_ratio')) || 58,
      leftZoom: parseInt(localStorage.getItem('kiosk_left_zoom')) || 100,
      rightZoom: parseInt(localStorage.getItem('kiosk_right_zoom')) || 100,
      ratioSettingsOpen: false,
      deviceId: '', deviceStatus: 'checking',  // checking | PENDING | APPROVED | REVOKED | badlink
    };
  },
  computed: {
    dots(){ const arr=['','','','']; for(let i=0;i<this.digits.length;i++) arr[i]='●'; return arr; },
    checkedInCount(){ return this.board.filter(r=>r.att && r.att.in).length; },
    checkedOutCount(){ return this.board.filter(r=>r.att && r.att.out).length; },
  },
  methods: {
    tickClock(){
      const d = new Date();
      const p = x => String(x).padStart(2,'0');
      const WD = ['일','월','화','수','목','금','토'];
      this.clock = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'  ('+WD[d.getDay()]+')';
      this.nowMin = d.getHours()*60 + d.getMinutes();
    },
    hmMin(hm){ if (!hm) return 0; const [h,m] = hm.split(':').map(Number); return h*60+m; },
    wdOf(dateStr){ if (!dateStr) return ''; const WD=['일','월','화','수','목','금','토']; return WD[new Date(dateStr+'T00:00:00').getDay()]; },
    mkAbsenceRefSuffix(row){
      if (!row.linked || row.linked.kind!=='absence') return '(결석연결없음)';
      return '(결석 '+row.linked.date.slice(5)+'('+this.wdOf(row.linked.date)+'))';
    },
    stuAbsenceSuffix(row){
      if (row.no_makeup) return '(보강안함)';
      const lk = row.linked;
      if (!lk) return '(보강미정)';
      const md = lk.date.slice(5)+'('+this.wdOf(lk.date)+')';
      if (lk.status==='ABSENT') return '(보강결석)';
      if (lk.done) return '(보강 '+md+' 완료)';
      return '(보강 '+md+' 예정)';
    },
    elapsed(row){
      if (!row.att.in) return '';
      const start = this.hmMin(row.att.in);
      const end = row.att.out ? this.hmMin(row.att.out) : this.nowMin;
      const mins = Math.max(0, end-start);
      return mins+'분 / '+(row.duration_minutes||60)+'분';
    },
    statusInfo(row){
      if (row.status==='ABSENT') return { label:'결석'+this.stuAbsenceSuffix(row), cls:'text-rose-400' };
      if (row.status==='LEAVE') return { label:'임시휴원', cls:'text-purple-400' };
      if (row.is_makeup) return { label:'보강'+this.mkAbsenceRefSuffix(row), cls:'text-blue-400' };
      if (row.att.in){
        const refStart = this.lateRefStart(row);
        const diff = this.hmMin(row.att.in) - this.hmMin(refStart);
        if (diff > 5) return { label:diff+'분 지각', cls:'text-amber-400' };
        if (diff < -5) return { label:(-diff)+'분 일찍', cls:'text-sky-400' };
        return null;
      }
      if (this.hmMin(row.start_time) < this.nowMin) return { label:'미등원', cls:'text-rose-300' };
      return null;
    },
    nameCls(row){
      if (row.status==='ABSENT' || row.status==='LEAVE') return 'line-through';
      if (!row.att.in && this.hmMin(row.start_time) < this.nowMin) return 'text-red-500';
      return '';
    },
    // 같은 학생의 바로 이어지는 연속 수업(뒤 수업 시작=앞 수업 종료) 파트너 찾기 — 포털 오늘 운영과 동일 규칙
    findContPartner(row){
      const s = this.hmMin(row.start_time), e = s + (row.duration_minutes||60);
      return this.board.find(o=>o!==row && row.student_id && o.student_id===row.student_id &&
        (this.hmMin(o.start_time)+(o.duration_minutes||60)===s || e===this.hmMin(o.start_time))) || null;
    },
    // 연속수업(등원/하원 공유)이면 지각/일찍 기준은 항상 앞 타임 시작시각으로 계산
    lateRefStart(row){
      const partner = this.findContPartner(row);
      if (partner && this.hmMin(partner.start_time) < this.hmMin(row.start_time)) return partner.start_time;
      return row.start_time;
    },
    // 연속수업은 시간순 정렬을 깨더라도 서로 붙여서 보여줌(포털 오늘 운영과 동일)
    boardOrdered(){
      const list = this.board;
      const partnerOf = new Map();
      list.forEach(it=>{
        if (!it.student_id) return;
        const s = this.hmMin(it.start_time), e = s + (it.duration_minutes||60);
        const nxt = list.find(o=>o!==it && o.student_id===it.student_id && this.hmMin(o.start_time)===e);
        if (nxt) partnerOf.set(it, nxt);
      });
      const emitted = new Set(); const out = [];
      list.forEach(it=>{
        if (emitted.has(it)) return;
        out.push(it); emitted.add(it);
        const nxt = partnerOf.get(it);
        if (nxt && !emitted.has(nxt)){ out.push(nxt); emitted.add(nxt); }
      });
      return out;
    },
    nowLineIndex(){
      // 이미 시작된 마지막 수업 바로 다음 인덱스(연속수업 붙여배치로 순서가 섞일 수 있어 뒤에서부터 훑음)
      const ls=this.boardOrdered();
      for (let i=ls.length-1;i>=0;i--){ if (this.hmMin(ls[i].start_time) <= this.nowMin) return i+1; }
      return 0;
    },
    scrollToNow(){
      this.$nextTick(()=>{
        const el = this.$refs.nowRow;
        const target = Array.isArray(el) ? el[0] : el;
        if (target && target.scrollIntoView) target.scrollIntoView({ block:'center', behavior:'smooth' });
      });
    },
    async loadBoard(){
      try {
        const d = await kioskApi('GET', '/api/academy/kiosk_board?b='+encodeURIComponent(this.b)+'&t='+encodeURIComponent(this.t)+'&device_id='+encodeURIComponent(this.deviceId));
        this.board = d.rows||[];
        this.scrollToNow();
      } catch(e){ /* 조용히 실패(우측 키패드 동작에는 영향 없음) */ }
    },
    async requestDevice(){
      const wasApproved = this.deviceStatus === 'APPROVED';
      try {
        const d = await kioskApi('POST', '/api/academy/kiosk_device_request', { b:this.b, t:this.t, device_id:this.deviceId, user_agent:navigator.userAgent });
        this.deviceStatus = d.status;
        if (!wasApproved && this.deviceStatus === 'APPROVED'){
          this.loadBoard();
          if (!this._boardInterval) this._boardInterval = setInterval(this.loadBoard, 25000);
        }
      } catch(e){ this.deviceStatus = 'badlink'; this.resultSub = e.message || ''; }
    },
    press(n){
      if (this.stage !== 'keypad' || this.busy) return;
      if (this.digits.length >= 4) return;
      this.digits += String(n);
      if (this.digits.length === 4) this.lookup();
    },
    backspace(){ if (this.stage==='keypad') this.digits = this.digits.slice(0,-1); },
    async lookup(){
      this.busy = true;
      try {
        const d = await kioskApi('GET', '/api/academy/kiosk_lookup?b='+encodeURIComponent(this.b)+'&t='+encodeURIComponent(this.t)+'&device_id='+encodeURIComponent(this.deviceId)+'&last4='+this.digits);
        if (!d.matches || !d.matches.length){
          this.resultMsg = '일치하는 학생이 없습니다.';
          this.resultSub = '번호를 다시 확인해주세요.';
          this.stage = 'error';
          setTimeout(()=>this.reset(), 2200);
        } else if (d.matches.length === 1){
          this.matches = d.matches;
          this.confirm(d.matches[0]);
        } else {
          this.matches = d.matches;
          this.stage = 'matches';
        }
      } catch(e){
        this.resultMsg = '오류가 발생했습니다.';
        this.resultSub = e.message || '';
        this.stage = 'error';
        setTimeout(()=>this.reset(), 2500);
      } finally { this.busy = false; }
    },
    async confirm(m){
      this.busy = true;
      try {
        const d = await kioskApi('POST', '/api/academy/kiosk_check', { b:this.b, t:this.t, device_id:this.deviceId, student_id:m.student_id });
        if (d.action === 'in'){ this.resultMsg = d.name+'님 등원 완료'; this.resultSub = d.time; }
        else if (d.action === 'out'){ this.resultMsg = d.name+'님 하원 완료'; this.resultSub = d.time; }
        else { this.resultMsg = d.name+'님은 오늘 등원·하원이 모두 처리되었습니다.'; this.resultSub = '등원 '+(d.in||'-')+' · 하원 '+(d.out||'-'); }
        this.stage = 'result';
        this.loadBoard();
        setTimeout(()=>this.reset(), 2600);
      } catch(e){
        this.resultMsg = '처리 중 오류가 발생했습니다.';
        this.resultSub = e.message || '';
        this.stage = 'error';
        setTimeout(()=>this.reset(), 2500);
      } finally { this.busy = false; }
    },
    reset(){ this.digits=''; this.matches=[]; this.resultMsg=''; this.resultSub=''; this.stage='keypad'; },
    toggleFullscreen(){
      if (!document.fullscreenElement){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
      else { document.exitFullscreen && document.exitFullscreen(); }
    },
    async requestWakeLock(){
      // 표준 Wake Lock API(HTTPS 등 보안 컨텍스트 필요) — 되면 이걸로 충분함
      if ('wakeLock' in navigator){
        try {
          this._wakeLock = await navigator.wakeLock.request('screen');
          this._wakeLock.addEventListener('release', ()=>{ this._wakeLock = null; });
        } catch(e){ /* 지원 안 하거나 거부됨 — 아래 대체 방식으로 처리 */ }
      }
      // 대체 방식: HTTP 등 Wake Lock API를 못 쓰는 환경에서도 동작하도록, 화면에 안 보이는
      // 1x1 캔버스를 영상으로 계속 재생시켜 모바일 브라우저의 화면 꺼짐을 억제(널리 쓰이는 방법)
      this._startNoSleepFallback();
    },
    releaseWakeLock(){
      if (this._wakeLock){ this._wakeLock.release(); this._wakeLock = null; }
      this._stopNoSleepFallback();
    },
    _startNoSleepFallback(){
      if (this._noSleepVideo) return;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 2; canvas.height = 2;
        canvas.getContext('2d').fillRect(0, 0, 2, 2);
        const stream = canvas.captureStream(1);
        const v = document.createElement('video');
        v.muted = true; v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('autoplay', '');
        v.srcObject = stream;
        v.style.cssText = 'position:fixed;left:-1px;top:-1px;width:1px;height:1px;opacity:0;pointer-events:none;';
        document.body.appendChild(v);
        v.play().catch(()=>{});
        this._noSleepVideo = v; this._noSleepStream = stream;
      } catch(e){ /* 미지원 브라우저면 조용히 무시 */ }
    },
    _stopNoSleepFallback(){
      if (this._noSleepVideo){ this._noSleepVideo.pause(); this._noSleepVideo.remove(); this._noSleepVideo = null; }
      if (this._noSleepStream){ this._noSleepStream.getTracks().forEach(t=>t.stop()); this._noSleepStream = null; }
    },
    toggleKeepAwake(){
      this.keepAwake = !this.keepAwake;
      localStorage.setItem('kiosk_keep_awake', this.keepAwake ? '1' : '0');
      if (this.keepAwake) this.requestWakeLock(); else this.releaseWakeLock();
    },
    setLeftRatio(v){
      const n = Math.max(20, Math.min(80, parseInt(v) || 58));
      this.leftRatio = n;
      localStorage.setItem('kiosk_left_ratio', n);
    },
    setLeftZoom(v){
      const n = Math.max(70, Math.min(200, parseInt(v) || 100));
      this.leftZoom = n;
      localStorage.setItem('kiosk_left_zoom', n);
    },
    setRightZoom(v){
      const n = Math.max(70, Math.min(200, parseInt(v) || 100));
      this.rightZoom = n;
      localStorage.setItem('kiosk_right_zoom', n);
    },
  },
  async mounted(){
    this.tickClock();
    setInterval(this.tickClock, 1000);
    document.addEventListener('fullscreenchange', ()=>{ this.isFullscreen = !!document.fullscreenElement; });
    if (this.keepAwake) this.requestWakeLock();
    // 화면 꺼짐 방지는 탭이 백그라운드로 가면 자동 해제되므로, 다시 보일 때 켜져 있으면 재요청
    document.addEventListener('visibilitychange', ()=>{
      if (document.visibilityState === 'visible' && this.keepAwake){
        this.requestWakeLock();
        if (this._noSleepVideo) this._noSleepVideo.play().catch(()=>{});
      }
    });
    if (!this.b || !this.t){
      this.deviceStatus = 'badlink';
      this.resultSub = '관리자에게 링크를 다시 요청하세요.';
      return;
    }
    // 이 브라우저(기기)의 식별자 — 최초 1회 생성해 localStorage에 저장, 이후 계속 재사용
    this.deviceId = localStorage.getItem('kiosk_device_id') || '';
    if (!this.deviceId){
      this.deviceId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(16).slice(2)));
      localStorage.setItem('kiosk_device_id', this.deviceId);
    }
    await this.requestDevice();
    setInterval(()=>{ if (this.deviceStatus!=='APPROVED') this.requestDevice(); }, 5000);
  },
  template: `
    <div class="fixed top-2 right-2 z-50 flex items-center gap-1.5">
      <label class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs border border-slate-600 cursor-pointer select-none">
        <input type="checkbox" :checked="keepAwake" @change="toggleKeepAwake" class="w-3.5 h-3.5" />
        {{ keepAwake ? '🔆 계속 켜짐' : '화면 꺼짐 방지' }}
      </label>
      <div class="relative">
        <button @click="ratioSettingsOpen=!ratioSettingsOpen" class="px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs border border-slate-600">⚙️ 화면 설정</button>
        <div v-if="ratioSettingsOpen" class="absolute right-0 mt-1 w-72 bg-slate-800 border border-slate-600 rounded-lg shadow-xl p-3 text-xs text-slate-300 space-y-3">
          <div>
            <div class="flex items-center justify-between mb-1">
              <span>출결현황</span>
              <span class="font-mono">{{ leftRatio }}% / {{ 100-leftRatio }}%</span>
              <span>키오스크</span>
            </div>
            <input type="range" min="20" max="80" step="2" :value="leftRatio" @input="setLeftRatio($event.target.value)" class="w-full" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <span>출결현황 글씨 크기</span>
              <span class="font-mono">{{ leftZoom }}%</span>
            </div>
            <input type="range" min="70" max="200" step="10" :value="leftZoom" @input="setLeftZoom($event.target.value)" class="w-full" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <span>키오스크 글씨 크기</span>
              <span class="font-mono">{{ rightZoom }}%</span>
            </div>
            <input type="range" min="70" max="200" step="10" :value="rightZoom" @input="setRightZoom($event.target.value)" class="w-full" />
          </div>
          <div class="text-[10px] text-slate-500">이 기기에만 적용됩니다.</div>
        </div>
      </div>
      <button @click="toggleFullscreen" class="px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs border border-slate-600">
        {{ isFullscreen ? '⤢ 전체화면 해제' : '⛶ 전체화면' }}
      </button>
    </div>

    <!-- 기기 미승인: 대기/거절 화면(승인되면 자동으로 아래 본 화면으로 전환) -->
    <div v-if="deviceStatus!=='APPROVED'" class="w-full h-full flex items-center justify-center p-6">
      <div class="text-center max-w-md">
        <template v-if="deviceStatus==='checking'">
          <div class="text-lg text-slate-400">확인 중...</div>
        </template>
        <template v-else-if="deviceStatus==='PENDING'">
          <div class="text-5xl mb-4">🔒</div>
          <div class="text-2xl font-bold mb-2">관리자 승인 대기 중</div>
          <p class="text-slate-400 leading-relaxed">이 태블릿(브라우저)은 아직 등록되지 않았습니다.<br>
            학원 포털의 "오늘 운영 → 기기 등록"에서 이 기기를 승인해주세요.<br>승인되면 자동으로 화면이 전환됩니다.</p>
          <div class="mt-6 text-xs text-slate-600 font-mono">기기 ID: {{ deviceId.slice(0,8) }}</div>
        </template>
        <template v-else-if="deviceStatus==='REVOKED'">
          <div class="text-5xl mb-4">⛔</div>
          <div class="text-2xl font-bold mb-2">사용이 취소된 기기입니다</div>
          <p class="text-slate-400">관리자에게 문의해 다시 등록해주세요.</p>
        </template>
        <template v-else>
          <div class="text-5xl mb-4">⚠️</div>
          <div class="text-2xl font-bold mb-2">잘못된 접속입니다</div>
          <p class="text-slate-400">{{ resultSub || '관리자에게 링크를 다시 요청하세요.' }}</p>
        </template>
      </div>
    </div>

    <template v-else>
    <!-- 왼쪽: 오늘 출결 현황판 -->
    <div class="h-full overflow-auto border-r border-slate-700 p-5" :style="{width: leftRatio+'%'}">
    <div :style="{zoom: leftZoom/100}">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm text-slate-400">📋 오늘 출결 현황</div>
        <div class="text-xs text-slate-400">등원 <span class="text-emerald-400 font-semibold">{{ checkedInCount }}</span>명, 하원 <span class="text-indigo-400 font-semibold">{{ checkedOutCount }}</span>명</div>
      </div>
      <table class="w-full text-sm">
        <thead class="sticky top-0 bg-slate-900">
          <tr class="text-slate-400 text-left border-b border-slate-700">
            <th class="py-1.5 pr-2 font-normal">시각</th>
            <th class="py-1.5 pr-2 font-normal">학생</th>
            <th class="py-1.5 pr-2 font-normal">등원</th>
            <th class="py-1.5 pr-2 font-normal">하원</th>
            <th class="py-1.5 pr-2 font-normal">상태</th>
            <th class="py-1.5 pr-2 font-normal text-right">경과</th>
          </tr>
        </thead>
        <tbody>
          <template v-for="(r,i) in boardOrdered()" :key="i">
            <tr v-if="i===nowLineIndex()" ref="nowRow" class="bg-rose-500/10">
              <td colspan="6" class="py-0.5 text-[11px] text-rose-400 font-medium border-y border-rose-500/40">▶ 현재 {{ clock.slice(0,5) }}</td>
            </tr>
            <tr class="border-b border-slate-800">
              <td class="py-1.5 pr-2 font-mono text-slate-300">{{ r.start_time }}</td>
              <td class="py-1.5 pr-2 font-medium" :class="nameCls(r)">{{ r.student_name }}<span v-if="findContPartner(r)" class="ml-0.5 opacity-60" title="연속 수업(이어짐)">🔗</span><span v-if="r.adhoc" class="ml-1 text-[10px] px-1 rounded bg-amber-500/20 text-amber-300">수업외</span></td>
              <td class="py-1.5 pr-2" :class="r.att.in ? 'text-emerald-400' : 'text-slate-600'">{{ r.att.in || '-' }}</td>
              <td class="py-1.5 pr-2" :class="r.att.out ? 'text-indigo-400' : 'text-slate-600'">{{ r.att.out || '-' }}</td>
              <td class="py-1.5 pr-2 text-xs whitespace-nowrap" :class="(statusInfo(r)||{}).cls || 'text-slate-700'">{{ statusInfo(r) ? statusInfo(r).label : '' }}</td>
              <td class="py-1.5 pr-2 text-right text-xs" :class="elapsed(r) ? 'text-slate-400' : 'text-slate-600'">{{ elapsed(r) || (r.status!=='ABSENT' ? '/ '+(r.duration_minutes||60)+'분' : '') }}</td>
            </tr>
          </template>
          <tr v-if="board.length && nowLineIndex()===board.length" ref="nowRow" class="bg-rose-500/10">
            <td colspan="6" class="py-0.5 text-[11px] text-rose-400 font-medium border-y border-rose-500/40">▶ 현재 {{ clock.slice(0,5) }}</td>
          </tr>
          <tr v-if="board.length===0"><td colspan="6" class="py-8 text-center text-slate-500">오늘 수업이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
    </div>

    <!-- 오른쪽: 시계 + 키패드 -->
    <div class="h-full flex flex-col items-center justify-center p-6 overflow-auto" :style="{width: (100-leftRatio)+'%'}">
      <div class="text-center w-full max-w-xs" :style="{zoom: rightZoom/100}">
        <div class="text-sm text-slate-400 mb-1">두잉창의코딩 · 출결</div>
        <div class="font-mono text-2xl font-bold mb-6 tracking-wider">{{ clock }}</div>

        <template v-if="stage==='keypad'">
          <div class="text-sm text-slate-300 mb-3">보호자 연락처 뒤 4자리를 입력하세요</div>
          <div class="flex justify-center gap-2.5 mb-6">
            <div v-for="(d,i) in dots" :key="i" class="w-10 h-12 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center text-xl">{{ d }}</div>
          </div>
          <div class="grid grid-cols-3 gap-2.5">
            <button v-for="n in [1,2,3,4,5,6,7,8,9]" :key="n" @click="press(n)"
                    class="h-14 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-xl font-semibold">{{ n }}</button>
            <button @click="reset" class="h-14 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm text-slate-300">전체지움</button>
            <button @click="press(0)" class="h-14 rounded-xl bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-xl font-semibold">0</button>
            <button @click="backspace" class="h-14 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm text-slate-300">◀ 지우기</button>
          </div>
        </template>

        <template v-else-if="stage==='matches'">
          <div class="text-sm text-slate-300 mb-4">본인 이름을 선택하세요</div>
          <div class="flex flex-col gap-2.5">
            <button v-for="m in matches" :key="m.student_id" @click="confirm(m)"
                    class="h-14 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-lg font-semibold flex flex-col items-center justify-center">
              <span>{{ m.name }}</span>
              <span class="text-xs font-normal text-indigo-200">{{ m.school }}</span>
            </button>
            <button @click="reset" class="mt-2 text-sm text-slate-400">취소</button>
          </div>
        </template>

        <template v-else-if="stage==='result'">
          <div class="text-4xl mb-4">✅</div>
          <div class="text-xl font-bold mb-2">{{ resultMsg }}</div>
          <div class="text-base text-slate-300">{{ resultSub }}</div>
        </template>

        <template v-else-if="stage==='error'">
          <div class="text-4xl mb-4">⚠️</div>
          <div class="text-xl font-bold mb-2">{{ resultMsg }}</div>
          <div class="text-base text-slate-300">{{ resultSub }}</div>
        </template>
      </div>
    </div>
    </template>
  `,
}).mount('#app');
</script>
</body>
</html>
